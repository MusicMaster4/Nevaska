[package]
name = "nevaska"
version = "0.1.0"
description = "Nevaska chess GUI"
authors = ["Nevaska"]
edition = "2021"
default-run = "nevaska"

[lib]
name = "nevaska_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nevaska"
path = "src/main.rs"

[[bin]]
name = "stub_uci"
path = "src/bin/stub_uci.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = "0.27"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
